[package]
name = "scopinator-cli"
version = "0.8.1"
description = "CLI for the scopinator telescope control library"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "scopinator"
path = "src/main.rs"

[dependencies]
scopinator = { workspace = true, features = ["alpaca"] }
scopinator-seestar.workspace = true
scopinator-types.workspace = true
anyhow.workspace = true
serde_json.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
iana-time-zone = "0.1"

[dev-dependencies]
serde_json.workspace = true
tokio.workspace = true
