name: Extended

# Heavyweight tests that don't run on every commit:
#   - Coverage report
#   - Fuzz smoke runs (60s/target)
#   - (Future) loom/shuttle/turmoil race tests
#
# Schedule: nightly UTC. Also dispatchable manually.

on:
  schedule:
    - cron: '17 6 * * *'   # 06:17 UTC daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extended.yml'
      - 'fuzz/**'

concurrency:
  group: extended-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: coverage (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      # Floor: workspace line coverage measured 81.98% on 2026-11-14. The floor
      # sits a few points below so that timing-dependent paths do not flake it;
      # raise it when coverage rises.
      - run: cargo llvm-cov report --summary-only --fail-under-lines 78
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
          retention-days: 30

  fuzz-smoke:
    name: fuzz-smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - frame_parse
          - json_rpc_classify
          - discovery_parse
          - event_parse
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: smoke run (60s)
        working-directory: fuzz
        # A target with committed seeds (fuzz/seeds/<target>) starts from them;
        # fuzz/corpus is the scratch corpus and is not committed.
        run: |
          mkdir -p "corpus/${{ matrix.target }}"
          SEEDS=""
          if [ -d "seeds/${{ matrix.target }}" ]; then SEEDS="seeds/${{ matrix.target }}"; fi
          # The prebuilt cargo-fuzz is a musl binary and defaults to a musl
          # target, which the sanitizer cannot build for; name the target.
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} \
            "corpus/${{ matrix.target }}" $SEEDS -- -max_total_time=60
      - name: upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30
